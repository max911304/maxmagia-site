:root{--bg:#08080a;--card:#121214;--gold:#d4b48a;--gold-hi:#f3dcae;--teal:#4fa3a5;--txt:#f0ece4;--mut:rgba(240,236,228,.68);--dim:rgba(240,236,228,.44);--line:rgba(212,180,138,.22);--err:#e8806f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);overflow-x:clip}
body{font-family:'Manrope',system-ui,-apple-system,sans-serif;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 900px 520px at 50% -160px,rgba(212,180,138,.14),transparent 70%)}
.w{max-width:1180px;margin:0 auto;padding:16px 18px calc(36px + env(safe-area-inset-bottom))}
.top{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 4px}
.top svg{width:44px;height:44px}
.eye{text-align:center;font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--gold)}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(32px,7.4vw,48px);line-height:1.05;text-align:center}
h1 em{font-style:italic;color:var(--gold)}
.lead{text-align:center;color:var(--mut);font-size:15px;line-height:1.6;margin:10px auto 18px;max-width:520px}
.narrow{max-width:420px;margin:0 auto}
.scene{max-width:760px;margin:0 auto}
.scene svg{display:block;width:100%;height:auto}
.box{border:1px solid var(--line);background:rgba(18,18,20,.88);border-radius:20px;padding:18px 16px;margin-bottom:14px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;color:var(--dim);margin:0 0 6px 2px;text-align:center}
.f input,.f textarea{width:100%;min-height:50px;border-radius:14px;border:1px solid rgba(240,236,228,.16);background:#0d0d0f;color:var(--txt);font:inherit;font-size:16px;padding:11px 14px;outline:none;text-align:center}
.f textarea{min-height:72px;text-align:left}
.f input:focus,.f textarea:focus{border-color:var(--gold)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:14px;border:none;cursor:pointer;margin-top:8px;font:700 15px 'Manrope',sans-serif;
  background:linear-gradient(135deg,#ecd29b,#c8a96e 45%,#9e7540);color:#0e0b07;box-shadow:0 10px 28px rgba(200,169,110,.22)}
.btn.line{background:none;border:1px solid rgba(212,180,138,.4);color:var(--gold);box-shadow:none}
.btn[disabled]{opacity:.6}
.link-btn{background:none;border:none;color:var(--dim);font:500 13px 'Manrope',sans-serif;cursor:pointer;text-decoration:underline;display:block;margin:10px auto 0}
.err{color:var(--err);font-size:13.5px;margin-top:8px;min-height:1px;text-align:center}
.ok{color:#9fd8c1}
/* код: 6 клеток */
.code{display:flex;justify-content:center;gap:8px;margin:6px 0 4px}
.code input{width:46px;height:56px;border-radius:12px;border:1px solid rgba(212,180,138,.35);background:#0d0d0f;color:var(--gold-hi);font:700 24px 'Manrope',sans-serif;text-align:center;outline:none;caret-color:var(--gold)}
.code input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,180,138,.15)}
.hint{text-align:center;color:var(--mut);font-size:13.5px;line-height:1.55;margin-bottom:10px}
/* сцены */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes leg{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes arrive{from{transform:translateX(-470px)}to{transform:none}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:.95}}
.st{animation:twinkle 3.6s ease-in-out infinite}.st.b{animation-delay:1.2s}.st.c{animation-delay:2.3s}
.rig{animation:arrive 4.4s cubic-bezier(.2,.75,.3,1) both}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin 1.5s linear infinite}
.leg{transform-box:fill-box;transform-origin:50% 0;animation:leg .7s ease-in-out infinite}.leg.b{animation-delay:-.35s}
.bob{animation:bob .35s ease-in-out infinite}
.stopped .wheel,.stopped .leg,.stopped .bob{animation-play-state:paused}
.lamp{animation:glow 2.6s ease-in-out infinite}
.coach{transform-box:view-box}
.open .coach{animation:descend 1.5s cubic-bezier(.4,0,.3,1) forwards}
@keyframes descend{0%{transform:none}25%{transform:translate(4px,-10px)}60%{transform:translate(-30px,40px)}100%{transform:translate(-52px,64px)}}
.door{transform-box:fill-box;transform-origin:0 50%}
.open .door{animation:door 1.1s 1.4s cubic-bezier(.3,.7,.3,1) forwards}
@keyframes door{to{transform:scaleX(-.55) skewY(-6deg)}}
.dl,.rays,.burst{opacity:0}
.open .dl{animation:dl .9s 1.6s ease-out forwards}
@keyframes dl{to{opacity:1}}
.rays{transform-box:fill-box;transform-origin:center}
.open .rays{animation:rays 2.4s 1.9s ease-out forwards,rot 30s 1.9s linear infinite}
@keyframes rays{0%{opacity:0}100%{opacity:.85}}
@keyframes rot{to{transform:rotate(360deg)}}
.burst{transform-box:fill-box;transform-origin:center}
.open .burst{animation:burst 2.6s 1.8s ease-out forwards}
@keyframes burst{0%{opacity:0;transform:scale(.3)}60%{opacity:.95}100%{opacity:.8;transform:scale(1)}}
#flash{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,#fffdf2,#f3dcae 40%,rgba(243,220,174,0) 75%);opacity:0;pointer-events:none;z-index:20;transition:opacity .9s ease}
#flash.on{opacity:1}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.1s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-2deg)}30%{transform:scale(.92,1.08) rotate(2deg)}60%{transform:scale(1.06,.94) rotate(-1deg)}}
.halo{animation:glow 2.2s ease-in-out infinite}
/* приветствие */
.wel{display:grid;gap:22px;align-items:center;margin-top:6px}
.wel .pic{max-width:380px;margin:0 auto;width:100%}
.steps{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0 6px}
.step{position:relative;border:1px solid var(--line);border-radius:16px;padding:14px 12px 12px;background:linear-gradient(160deg,rgba(212,180,138,.09),rgba(18,18,20,.6));text-align:center}

.step .i{font-size:26px;line-height:1;margin-bottom:6px}
.step b{display:block;font-size:14px;margin-bottom:3px}
.step span{font-size:12.5px;color:var(--mut);line-height:1.45}
.big{font:700 22px 'Manrope',sans-serif;color:var(--gold-hi)}
.ads{display:grid;gap:10px;margin:8px 0}
.ad{display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:13px 14px;border:1px solid}
.ad .i{font-size:22px;line-height:1.1}
.ad b{display:block;font-size:14px;margin-bottom:2px}
.ad span{font-size:12.8px;color:var(--mut);line-height:1.5}
.ad.g{border-color:rgba(120,200,160,.35);background:rgba(120,200,160,.06)}
.ad.y{border-color:rgba(230,190,90,.35);background:rgba(230,190,90,.06)}
.ad.r{border-color:rgba(232,128,111,.4);background:rgba(232,128,111,.06)}
.ad code{font-size:11.5px;color:var(--gold-hi);word-break:break-word}
.nope{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 2px}
.nope span{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid rgba(232,128,111,.4);color:#f0b3a8}
.sec-t{text-align:center;font:600 22px 'Cormorant Garamond',serif;color:var(--gold-hi);margin:18px 0 8px}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5;color:var(--mut);margin:10px 0;cursor:pointer}
.ck input{flex:none;width:20px;height:20px;margin-top:2px;accent-color:#c8a96e}
a{color:var(--gold)}
/* кабинет */
.dash{display:grid;gap:14px;margin-top:10px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{border:1px solid rgba(240,236,228,.08);background:var(--card);border-radius:16px;padding:14px 8px;text-align:center}
.kpi b{display:block;font-size:24px;color:var(--gold-hi);line-height:1.15}
.kpi span{font-size:12px;color:var(--dim)}

details.box summary{list-style:none;cursor:pointer;text-align:center;font-weight:700;font-size:15.5px;padding:16px 0;position:relative}
details.box summary::-webkit-details-marker{display:none}
details.box summary::after{content:'›';position:absolute;right:2px;top:50%;transform:translateY(-50%) rotate(90deg);color:var(--gold);font-size:20px;transition:transform .2s}
details.box[open] summary::after{transform:translateY(-50%) rotate(-90deg)}
details.box[open]{padding-bottom:16px}
.box h2{text-align:center;font-size:15.5px;font-weight:700;margin-bottom:12px}

.lk button{width:100%;min-height:42px;border-radius:11px;border:1px solid rgba(240,236,228,.16);background:rgba(0,0,0,.2);color:var(--txt);font:600 13.5px 'Manrope',sans-serif;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:9px 6px;border-bottom:1px solid rgba(240,236,228,.07);text-align:left;color:var(--mut);vertical-align:top}
th{color:var(--txt);font-weight:600;font-size:12.5px}
td.r{text-align:right;color:var(--gold);white-space:nowrap}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:44px;border-radius:12px;border:1px solid rgba(240,236,228,.15);background:none;color:var(--mut);font:600 14px 'Manrope',sans-serif;cursor:pointer}
.seg button.on{border-color:var(--gold);color:var(--txt);background:rgba(212,180,138,.12)}
.p{font-size:13.5px;line-height:1.6;color:var(--mut);text-align:center;margin-bottom:10px}
.foot{text-align:center;font-size:12.5px;color:var(--dim);line-height:1.7;margin-top:26px}
.foot a{color:var(--mut)}
.fade{animation:fade .8s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (min-width:900px){
  .wel{grid-template-columns:.9fr 1.1fr}
  .wel .txt h1,.wel .txt .lead{text-align:left}
  .wel .txt .lead{margin-left:0}
  .steps{grid-template-columns:repeat(4,1fr)}
  .dash{grid-template-columns:1.35fr 1fr;align-items:start}
  .kpi b{font-size:28px}
}
@media (max-width:380px){.code input{width:40px;height:52px;font-size:21px}.code{gap:6px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

<script>
(function(){
  var app=document.getElementById('app'),D=null,EMAIL='',LEGAL='',DEMO=new URLSearchParams(location.search).get('demo');
  function E(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function $(id){return document.getElementById(id);}
  function err(t,id){var e=$(id||'err');if(e){e.className='err';e.textContent=t||'';}}
  function tpl(id){return $(id).innerHTML;}
  function api(p,b){
    if(DEMO)return demo(p,b);
    return fetch('/api/ref/'+p,{method:b?'POST':'GET',headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):undefined,credentials:'same-origin',cache:'no-store'})
      .then(function(r){return r.json().then(function(j){j._s=r.status;return j;}).catch(function(){return {ok:false,_s:r.status};});}).catch(function(){return {ok:false,error:'net'};});}
  var DM={step:0};
  function demo(p,b){return new Promise(function(res){setTimeout(function(){
    if(p==='p/me'){if(!DM.step)return res({ok:false,_s:401});
      return res({ok:true,kind:DEMO==='member'?'member':'external',name:'Анна Продюсер',terms:DM.step>1,code:'qagbtg',links:{site:'https://app.maxmagia.ru/api/ref/go/qagbtg',bot:'https://t.me/clubeshnik911_bot?start=ref_qagbtg'},
        payout:DEMO==='member'?'days':'money',money:'3 750 ₽',earned:'6 250 ₽',paid:'2 500 ₽',days:20,earned_days:28,brought:3,linked:5,legal:'',inn:'',pay_info:'',full_name:'',rates:{first:50,renewal:50},
        people:[{name:'Ольга С.',at:'2026-11-02',status:'в клубе · оплат: 2',paid:true,rub:'2 500 ₽',days:20},{name:'Ирина К.',at:'2026-11-08',status:'в клубе · оплат: 1',paid:true,rub:'1 250 ₽',days:12},{name:'Марина',at:'2026-11-12',status:'начал(а) вступление, ещё не оплатил(а)',paid:false}],
        statement:{clicks:41,months:[{month:'2026-11',n:3,rub:'3 750 ₽',days:28},{month:'2026-10',n:2,rub:'2 500 ₽',days:0}],payouts:[{rub:'2 500 ₽',note:'октябрь',at:'2026-11-10'}]}});}
    if(p==='p/code')return res({ok:true});
    if(p==='p/verify'){DM.step=1;return res({ok:true});}
    if(p==='p/terms'){DM.step=2;return api('p/me').then(res);}
    res({ok:true});},350);});}

  /* ── 1. вход: карета выезжает из леса ── */
  function login(){
    app.innerHTML='<h1>Вход в <em>ложу</em></h1><p class="lead">Ложа партнёров клуба — ваша ссылка, кто пришёл по ней и что вам начислено.</p>'+
      '<div class="scene" id="sc">'+tpl('tpl-road')+'</div>'+
      '<div class="narrow fade" id="st1"><div class="box"><div class="f"><label>Почта, на которую придёт ключ</label><input id="em" type="email" inputmode="email" autocomplete="email" placeholder="you@mail.ru"></div>'+
      '<button class="btn" id="b1">🗝 Прислать ключ</button><div class="err" id="err"></div></div></div>'+
      '<div class="narrow" id="st2" style="display:none"><div class="box"><p class="hint" id="hint"></p><div class="code" id="code"></div>'+
      '<div class="err" id="err2"></div><button class="link-btn" id="back">Другая почта</button></div></div>';
    var sc=$('sc');setTimeout(function(){sc.classList.add('stopped');},4400);
    $('b1').onclick=send;$('em').onkeydown=function(e){if(e.key==='Enter')send();};
    $('back').onclick=function(){$('st2').style.display='none';$('st1').style.display='block';};
    var c=$('code');for(var i=0;i<6;i++){var inp=document.createElement('input');inp.inputMode='numeric';inp.maxLength=1;inp.autocomplete=i?'off':'one-time-code';inp.setAttribute('aria-label','Цифра '+(i+1));c.appendChild(inp);}
    var ins=c.querySelectorAll('input');
    ins.forEach(function(inp,i){
      inp.oninput=function(){var v=inp.value.replace(/\D/g,'');
        if(v.length>1){v.split('').slice(0,6-i).forEach(function(d,k){ins[i+k].value=d;});var last=Math.min(5,i+v.length-1);ins[last].focus();}
        else{inp.value=v;if(v&&i<5)ins[i+1].focus();}
        check();};
      inp.onkeydown=function(e){if(e.key==='Backspace'&&!inp.value&&i>0){ins[i-1].focus();ins[i-1].value='';}};
      inp.onpaste=function(e){var t=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);if(!t)return;e.preventDefault();t.split('').forEach(function(d,k){if(ins[k])ins[k].value=d;});ins[Math.min(5,t.length-1)].focus();check();};
    });
    function check(){var code=Array.prototype.map.call(ins,function(x){return x.value;}).join('');if(code.length===6)verify(code);}
  }
  async function send(){
    EMAIL=($('em').value||'').trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(EMAIL))return err('Проверьте почту.');
    $('b1').disabled=true;var r=await api('p/code',{email:EMAIL});$('b1').disabled=false;
    if(r.error==='rate')return err('Слишком много попыток — подождите несколько минут.');
    $('sc').classList.add('stopped','open');
    $('st1').style.display='none';$('st2').style.display='block';$('st2').classList.add('fade');
    $('hint').innerHTML='Кучер открыл дверь кареты 🕯<br>Если <b>'+E(EMAIL)+'</b> — почта партнёра или участника клуба, на неё ушёл ключ из 6 цифр. Загляните и в «Спам».';
    setTimeout(function(){var f=$('code').querySelector('input');if(f)f.focus();},300);
  }
  var busy=false;
  async function verify(code){
    if(busy)return;busy=true;var r=await api('p/verify',{email:EMAIL,code:code});busy=false;
    if(r.ok){$('flash').classList.add('on');setTimeout(function(){load(true);},900);return;}
    $('code').querySelectorAll('input').forEach(function(x){x.value='';});$('code').querySelector('input').focus();
    err(r.error==='wrong'?'Ключ не подошёл — проверьте цифры.':r.error==='tries'?'Слишком много попыток — запросите новый ключ.':'Ключ устарел — запросите новый.','err2');
  }

  async function load(fromFlash){
    var r=await api('p/me');
    setTimeout(function(){$('flash').classList.remove('on');},fromFlash?250:0);
    if(r._s===401)return login();
    if(!r.ok){app.innerHTML='<p class="lead">📡 Не получилось загрузить — обновите страницу.</p>';return;}
    D=r;D.member=D.kind==='member';draw();window.scrollTo(0,0);
  }

  /* ── 2. приветствие: кучер со свечой ── */
  function howSteps(){
    var m=D.member;
    return '<div class="steps">'+
      '<div class="step"><span class="n">I</span><div class="i">🔗</div><b>Делитесь ссылкой</b><span>на страницу клуба или на бота в Telegram</span></div>'+
      '<div class="step"><span class="n">II</span><div class="i">🤝</div><b>Человек вступает</b><span>и закрепляется за вами <b>навсегда</b></span></div>'+
      '<div class="step"><span class="n">III</span><div class="i">'+(m?'🌙':'💰')+'</div><b class="big">'+(m?'40 % → 25 %':'50 %')+'</b><span>'+(m?'с первой оплаты и с каждого продления — днями клуба':'с каждой его оплаты, пока он в клубе')+'</span></div>'+
      '<div class="step"><span class="n">IV</span><div class="i">'+(m?'🎁':'🗓')+'</div><b>'+(m?'Дни — себе или в подарок':'Выплата раз в месяц')+'</b><span>'+(m?'самозанятым и ИП — по заявке деньгами':'после вашего чека «Мой налог» или документов ИП')+'</span></div></div>'+
      '<p class="p" style="margin-top:6px">Получатель оплаченного вами подарка, который раньше не был в клубе, тоже закрепляется за вами. При возврате оплаты начисление отменяется.</p>';
  }
  function adsInfo(){
    return '<div class="ads">'+
      '<div class="ad g"><div class="i">✅</div><div><b>Личное сообщение другу</b><span>Рекомендация в переписке — не реклама. Делитесь свободно.</span></div></div>'+
      '<div class="ad y"><div class="i">✉️</div><div><b>Рассылка по своей базе</b><span>Письма, push, сообщения — только тем, кто согласился получать от вас рекламу.</span></div></div>'+
      '<div class="ad r"><div class="i">📣</div><div><b>Пост в открытом канале, блоге, видео</b><span>Это реклама. До публикации — токен erid у оператора рекламных данных (ОРД) и пометка:<br><code>Реклама. Гущин Максим Сергеевич, ИНН 616616544435. erid: …</code><br>Ссылка с erid: <code>…/go/КОД?erid=…</code>. Регистрирует и отчитывается — тот, кто публикует.</span></div></div></div>'+
      '<div class="nope"><span>✕ обещать результат</span><span>✕ «лечение», «терапия»</span><span>✕ «курс», «обучение»</span><span>✕ другая цена — только «2 500 ₽ за 31 день»</span></div>';
  }
  function terms(){
    app.innerHTML='<div class="wel fade"><div class="pic">'+tpl('tpl-candle')+'</div><div class="txt">'+
      '<h1>Добро пожаловать <em>в ложу</em></h1><p class="lead">'+E((D.name||'').split(' ')[0]||'Друг')+', кучер зажёг свечу. Прежде чем войти — коротко о правилах ложи.</p>'+
      '<div class="sec-t">Как это работает</div>'+howSteps()+
      '<div class="sec-t">Реклама и маркировка</div>'+adsInfo()+
      '<div class="box" style="margin-top:14px"><label class="ck"><input type="checkbox" id="tk"><span>Я прочитал(а) и принимаю <a href="https://maxmagia.ru/partner.html" target="_blank" rel="noopener">условия программы</a>, включая обязанность маркировать рекламу</span></label>'+
      '<button class="btn" id="tb">🕯 Войти в ложу</button><div class="err" id="err"></div></div></div></div>';
    $('tb').onclick=async function(){if(!$('tk').checked)return err('Отметьте согласие с условиями.');var r=await api('p/terms',{ok:true});if(r.ok){D=r;D.member=D.kind==='member';draw();window.scrollTo(0,0);}else err('Не получилось — попробуйте ещё раз.');};
  }

  /* ── 3. кабинет ── */
  function draw(){
    if(!D.terms)return terms();
    var st=D.statement||{},ppl=D.people||[],m=D.member;
    var first=E((D.name||'').split(' ')[0]||(m?'Друг':'Партнёр'));
    var kpi1='<div><b>'+(st.clicks||0)+'</b><span>переходов</span></div><div><b>'+(D.linked||ppl.length)+'</b><span>закреплено</span></div><div><b>'+(D.brought||0)+'</b><span>в клубе</span></div>';
    var kpi2=m&&D.payout!=='money'
      ?'<div><b>'+(D.earned_days||0)+'</b><span>дней заработано</span></div><div><b>'+D.days+'</b><span>дней на счёте</span></div><div><b>'+E(D.money)+'</b><span>к выплате</span></div>'
      :'<div><b>'+E(D.earned)+'</b><span>начислено</span></div><div><b>'+E(D.paid)+'</b><span>выплачено</span></div><div><b>'+E(D.money)+'</b><span>к выплате</span></div>';
    var people='<details class="box" open><summary>👥 Кто пришёл по ссылке</summary>'+(ppl.length?'<table><tr><th>Кто</th><th>Когда</th><th>Статус</th><th style="text-align:right">Вам</th></tr>'+
      ppl.map(function(p){return '<tr><td>'+E(p.name)+'</td><td>'+E(p.at)+'</td><td>'+E(p.status)+'</td><td class="r">'+(p.paid?(p.days?'+'+p.days+' дн.':E(p.rub)):'—')+'</td></tr>';}).join('')+'</table>':'<p class="p">Пока никого — всё впереди 🕯</p>')+'</details>';
    var ms=st.months||[],ps=st.payouts||[];
    var stmt='<details class="box"><summary>🧾 Выписка по месяцам</summary>'+(ms.length?'<table><tr><th>Месяц</th><th>Оплат</th><th style="text-align:right">Начислено</th></tr>'+
      ms.map(function(x){return '<tr><td>'+E(x.month)+'</td><td>'+x.n+'</td><td class="r">'+(x.payout==='days'?x.days+' дн.':E(x.rub))+'</td></tr>';}).join('')+'</table>':'<p class="p">Начислений пока нет.</p>')+
      (ps.length?'<h2 style="margin-top:14px">Выплаты</h2><table>'+ps.map(function(p){return '<tr><td>'+E(p.at)+'</td><td>'+E(p.note||'')+'</td><td class="r">'+E(p.rub)+'</td></tr>';}).join('')+'</table>':'')+'</details>';
    var links='<div class="box"><h2>🔗 Ваши ссылки</h2>'+
      '<div class="lk"><div class="t">🌐 Страница клуба</div><div class="u">'+E(D.links.site)+'</div><button onclick="pCopy(\'site\',this)">📋 Скопировать</button></div>'+
      '<div class="lk"><div class="t">✈️ Бот клуба в Telegram</div><div class="u">'+E(D.links.bot)+'</div><button onclick="pCopy(\'bot\',this)">📋 Скопировать</button></div>'+
      (m?'<p class="p" style="margin:6px 0 0">Распорядиться днями — в личном кабинете: 🔔 → «Реферальная программа».</p>':'')+'</div>';
    LEGAL=D.legal||'';
    var reqTitle=m?'💼 Выплаты деньгами (самозанятым и ИП)':'💼 Реквизиты для выплат';
    var reqNote=m?(D.payout==='money'?'Выплаты деньгами подключены. Раз в месяц, после вашего чека.':D.money_req==='pending'?'Заявка у Максима — он проверит статус и подключит выплаты деньгами.':'Заполните — Максим проверит статус и переведёт новые начисления в деньги (40 % / 25 %). Дни на счёте останутся вашими.')
      :'Раз в месяц. После перевода пришлите чек «Мой налог» (самозанятый) или закрывающие документы (ИП) на club@maxmagia.ru.';
    var req='<details class="box"'+(!m&&!D.legal?' open':'')+'><summary>'+reqTitle+'</summary><p class="p">'+reqNote+'</p>'+
      '<div class="f"><label>Статус</label><div class="seg"><button type="button" data-l="самозанятый" class="'+(LEGAL==='самозанятый'?'on':'')+'">Самозанятый</button><button type="button" data-l="ИП" class="'+(LEGAL==='ИП'?'on':'')+'">ИП</button></div></div>'+
      '<div class="f"><label>ФИО полностью</label><input id="fn" value="'+E(D.full_name||'')+'"></div><div class="f"><label>ИНН (12 цифр)</label><input id="inn" inputmode="numeric" value="'+E(D.inn||'')+'"></div>'+
      '<div class="f"><label>Куда переводить</label><textarea id="pi" placeholder="СБП: телефон и банк, или реквизиты счёта ИП">'+E(D.pay_info||'')+'</textarea></div>'+
      '<button class="btn" id="rb">Сохранить</button><div class="err" id="err"></div></details>';
    var rules='<details class="box"><summary>📜 Правила ложи и маркировка</summary>'+howSteps()+adsInfo()+'</details>';
    app.innerHTML='<div class="fade"><h1>'+first+', <em>свет вам</em></h1><p class="lead">'+(m?'Реферальный кабинет — кого вы привели в клуб и что заработали.':'Ваша ссылка на клуб #MaxMagia и всё, что по ней произошло.')+'</p>'+
      '<div class="dash"><div><div class="kpi">'+kpi1+'</div><div class="kpi" style="margin:8px 0 14px">'+kpi2+'</div>'+people+stmt+'</div>'+
      '<div>'+links+req+rules+'<button class="link-btn" id="lo">Выйти из ложи</button></div></div></div>';
    app.querySelectorAll('.seg button').forEach(function(b){b.onclick=function(){LEGAL=b.dataset.l;app.querySelectorAll('.seg button').forEach(function(x){x.classList.toggle('on',x===b);});};});
    $('rb').onclick=async function(){var r=await api('p/req',{legal:LEGAL,full_name:$('fn').value,inn:$('inn').value,pay_info:$('pi').value});
      if(r.ok){D=r;D.member=D.kind==='member';draw();var e=$('err');if(e){e.className='err ok';e.textContent='✓ Сохранено';}return;}
      err(r.error==='legal'?'Выберите статус.':r.error==='inn'?'ИНН — 12 цифр.':'Заполните ФИО и куда переводить.');};
    $('lo').onclick=async function(){await api('p/logout',{});DM.step=0;login();};
  }
  window.pCopy=function(k,b){var t=k==='bot'?D.links.bot:D.links.site;
    try{navigator.clipboard.writeText(t);}catch(e){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(x){}ta.remove();}
    if(b){var o=b.textContent;b.textContent='✓ Скопировано';setTimeout(function(){b.textContent=o;},2000);}};
  load(false);
})();
</script>
