 'Я создавал её вместе с Claude: искусственным интеллектом, которого мы долго и бережно настраивали быть цифровой копией Милтона — с его историями, его неторопливостью, его любовью удивлять. Создавал для себя самого. И, конечно же, для вас, мои Хорошие 🙏',
 'Всё, что будет в этой книге, точно поможет нам узнать кое-что новое о себе… А может быть, поможет даже <em>забыть кое-что, что мы давно «знали» о себе</em>… Или позволит ощутить полностью всё то, что мы давно знаем, но привыкли обесценивать.',
 'Читайте медленно. Возвращайтесь, когда захочется. И, может быть, вы заметите, <span class="sg">как с каждым шагом внутри становится чуть больше места</span> — не торопитесь объяснять себе, откуда оно берётся. <span class="sg">Бессознательное умеет учиться само</span>, пока вы просто идёте.',
 'Этих практик нет ни в одной изданной книге, и нигде, кроме нашего клуба, они не появятся. <b>Они ждали именно вас.</b> И кажется, <span class="sg">вы пришли как раз вовремя</span>.',
 'С очень большой любовью к себе и к вам ❤'
];

/* ── хранилище ответов (синхронизирует mm-sync.js) ── */
function stageOf(n){for(var i=0;i<B.stages.length;i++){var s=B.stages[i].steps;if(n>=s[0].n&&n<=s[s.length-1].n)return i+1;}return 1;}
function lget(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
function lset(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
var META = lget('mm90-meta') || {done:{},last:''};
if(!META.done) META.done = {};
function saveMeta(){lset('mm90-meta',META);}
var cache = {};
function stKey(n){return 'mm90-st'+stageOf(n);}
function getAns(n,id){var k=stKey(n);if(!cache[k])cache[k]=lget(k)||{};return cache[k]['s'+n+'-'+id]||'';}
var timers = {};
function setAns(n,id,v){var k=stKey(n);if(!cache[k])cache[k]=lget(k)||{};
  if(v)cache[k]['s'+n+'-'+id]=v;else delete cache[k]['s'+n+'-'+id];
  clearTimeout(timers[k]);timers[k]=setTimeout(function(){lset(k,cache[k]);},500);}
window.addEventListener('pagehide',function(){Object.keys(timers).forEach(function(k){clearTimeout(timers[k]);lset(k,cache[k]);});});

/* ── список страниц книги ── */
function hasStep(n){return !!B.steps[n];}
var ORDER = ['author','intro'];
B.stages.forEach(function(st){st.steps.forEach(function(s){if(hasStep(s.n)){ORDER.push('s'+s.n);if(s.n===1)ORDER.push('ann');}});});
function doneCount(){var c=0;for(var n=1;n<=90;n++)if(META.done['s'+n])c++;return c;}

/* ── экраны и навигация ── */
function show(id){['cover','map','page'].forEach(function(x){$(x).classList.toggle('on',x===id);});window.scrollTo(0,0);tgBack(id);}
function route(){
  var h=decodeURIComponent(location.hash.slice(1));
  if(!h){show('cover');return;}
  if(h==='map'){renderMap();show('map');return;}
  if(ORDER.indexOf(h)>=0){renderPage(h);show('page');return;}
  renderMap();show('map');
}
function go(h){if(location.hash.slice(1)===h)route();else location.hash=h;}
window.addEventListener('hashchange',route);

function tgBack(id){
  if(!TG||!TG.BackButton)return;
  try{TG.BackButton.show();}catch(e){}
}
if(TG){try{TG.ready();TG.expand();TG.BackButton.onClick(function(){
  var h=location.hash.slice(1);
  if(!h){location.href=CAB;}else if(h==='map'){location.hash='';}else{location.hash='map';}
});}catch(e){}}

$('toCab').href=CAB;$('toCab2').href=CAB;$('toCab3').href=CAB;
$('mapBack').addEventListener('click',function(e){e.preventDefault();history.replaceState(null,'',location.pathname+location.search);route();});

/* ── обложка: книга открывается ── */
var opening=false;
$('book').addEventListener('click',function(){
  if(opening)return;opening=true;
  var b=$('book');b.classList.add('open');
  var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(function(){opening=false;b.classList.remove('open');go('map');},rm?0:1150);
});

/* ── карта пути ── */
function item(key,num,title,cls,small){
  var done=META.done[key];
  return '<li><button type="button" class="it '+(cls||'')+(done?' done':'')+(META.last===key?' last':'')+'" data-k="'+key+'">'+
    '<span class="n">'+num+'</span><span class="tt">'+(small?'<small>'+small+'</small>':'')+esc(title)+'</span><span class="ck" aria-hidden="true">✓</span></button></li>';
}
function renderMap(){
  $('mapLead').textContent='Четыре этапа, девяносто шагов. Сначала опора, потом желания, потом «я могу», потом движение. Каждый седьмой шаг — остановка, чтобы оглянуться.';
  var h='<ul class="toc" style="margin-top:22px">'+item('author','✦','Пара слов от автора','special')+item('intro','✦','Несколько слов, прежде чем ты начнёшь','special')+'</ul>';
  var roman=['Этап первый','Этап второй','Этап третий','Этап четвёртый'];
  B.stages.forEach(function(st,i){
    var nm=st.name.replace(/^Этап[^.]*\.\s*/,'');
    h+='<div class="sec"><div class="no">'+roman[i]+'</div><h2>'+esc(nm)+'</h2><p>'+esc(st.sub.replace(/^Шаги[^.]*\.\s*/,''))+'</p></div><ul class="toc">';
    st.steps.forEach(function(s){
      var title=s.t, small='';
      var m=title.match(/^(Остановка [^.]+)\.\s*(.*)$/);
      if(m){small=m[1];title=m[2];}
      if(hasStep(s.n)){
        h+=item('s'+s.n,pad(s.n),title,s.stop?'stop':'',small);
        if(s.n===1)h+=item('ann','✧','Твой проводник: познакомься с Энн','special');
      }else{
        h+='<li><div class="it soon'+(s.stop?' stop':'')+'" aria-disabled="true"><span class="n">'+pad(s.n)+'</span><span class="tt">'+(small?'<small>'+esc(small)+'</small>':'')+esc(title)+'</span><span class="ck">скоро</span></div></li>';
      }
    });
    h+='</ul>';
  });
  $('toc').innerHTML=h;
  var c=doneCount();$('pDone').textContent=c;$('pBar').style.width=(c/90*100)+'%';
  var next=ORDER.filter(function(k){return !META.done[k];})[0];
  var target=META.last&&ORDER.indexOf(META.last)>=0&&!META.done[META.last]?META.last:(next||'author');
  $('contBtn').textContent=(META.last||c)?'Продолжить: '+label(target):'Начать путь';
  $('contBtn').onclick=function(){go(target);};
  [].forEach.call(document.querySelectorAll('#toc button.it'),function(b){b.addEventListener('click',function(){go(b.dataset.k);});});
  var l=document.querySelector('#toc .it.last');if(l&&location.hash==='#map'&&window.__mapScrolled!==true){window.__mapScrolled=true;setTimeout(function(){l.scrollIntoView({block:'center'});},60);}
}
function label(k){
  if(k==='author')return 'Пара слов от автора';if(k==='intro')return 'Несколько слов';if(k==='ann')return 'Знакомство с Энн';
  var n=+k.slice(1);return 'шаг '+pad(n);
}

/* ── страница ── */
function para(arr,cls){return '<div class="prose'+(cls?' '+cls:'')+'">'+arr.map(function(p){return '<p>'+p+'</p>';}).join('')+'</div>';}
function rule(){return '<div class="rule" aria-hidden="true"><i></i>✦<i></i></div>';}
function ansBox(n,id,ph){
  return '<label class="sr" style="position:absolute;left:-9999px" for="a-'+n+'-'+id+'">Твой ответ</label><textarea class="ans" id="a-'+n+'-'+id+'" data-n="'+n+'" data-id="'+id+'" placeholder="'+esc(ph)+'">'+esc(getAns(n,id))+'</textarea><div class="saved" id="sv-'+n+'-'+id+'">сохранено ✓</div>';
}
function renderPage(k){
  var leaf=$('leaf'),h='',nav='';
  META.last=k;saveMeta();
  var idx=ORDER.indexOf(k),prev=ORDER[idx-1],next=ORDER[idx+1];
  if(k==='author'){
    $('pgNo').textContent='Вступление';
    h='<div class="kicker">От автора</div><h1 class="ttl">Пара слов от автора</h1>'+rule()+para(AUTHOR)+'<div class="sig">© Макс Гущин</div>';
  }else if(k==='intro'){
    $('pgNo').textContent='Вступление';
    h='<div class="kicker">AI Милтон Эриксон</div><h1 class="ttl">Несколько слов, прежде чем ты начнёшь</h1>'+rule()+para(B.intro);
  }else if(k==='ann'){
    $('pgNo').textContent='Проводник';
    var a=B.ann.slice(),body='';
    if(a.length&&/^<b>[^<]*<\/b>$/.test(a[0]))a.shift();
    a.forEach(function(x){body+= typeof x==='string'?'<p>'+x+'</p>':'<ol class="ann-ol">'+x.ol.map(function(li){return '<li>'+li+'</li>';}).join('')+'</ol>';});
    h='<div class="kicker">Твой проводник</div><h1 class="ttl">Познакомься с Энн</h1>'+rule()+'<div class="prose">'+body+'</div>'+
      '<div class="card guide"><h3>Файлы для Энн</h3>'+(ANN_ZIP?'<p class="sm">Архив из четырёх файлов — по кнопке ниже.</p><div class="btns"><a class="btn main" href="'+esc(ANN_ZIP)+'" download>⬇ Скачать файлы для Энн</a></div>':
      '<p class="sm" style="margin:0">Архив из четырёх файлов появится здесь, как только Энн будет готова к встрече. А пока просто пиши ответы в книге: здесь же их можно будет скопировать и отнести ей.</p>')+'</div>';
  }else{
    var n=+k.slice(1),s=B.steps[n],meta=findMeta(n);
    $('pgNo').textContent='Шаг '+n+' из 90';
    var title=s.t.replace(/^Остановка [^.]+\.\s*/,'');
    var kick=meta&&meta.stop?(s.t.match(/^(Остановка [^.]+)/)||['','Остановка'])[1]+' · шаг '+pad(n):'Шаг '+pad(n);
    h='<div class="kicker">'+esc(kick)+'</div><h1 class="ttl">'+esc(title)+'</h1>'+rule()+
      '<img class="pic" alt="" src="img/'+encodeURIComponent('шаг-'+pad(n)+'.jpg')+'" onerror="if(!this.dataset.f){this.dataset.f=1;this.src=this.src.replace(/\\.jpg$/,\'.png\');}else{this.remove();}">'+
      para(s.story);
    var guideQ='';
    s.parts.forEach(function(p,i){
      if(p.k==='task'){
        h+='<section class="card"><div class="ch"><span class="cn">'+p.no+'</span><h3>'+esc(p.t)+'</h3>'+(p.min?'<span class="mn">'+esc(p.min)+' мин</span>':'')+'</div>'+para(p.p)+ansBox(n,'t'+p.no,'Твой ответ… можно с ошибками и недописанными фразами')+'</section>';
      }else if(p.k==='day'){
        h+='<section class="card day"><div class="ch"><h3>🌿 Маленькое задание на день</h3></div>'+para(p.p)+ansBox(n,'day','Как прошло? Можно записать вечером — по желанию')+'</section>';
      }else if(p.k==='soft'){
        h+='<section class="card soft"><div class="ch"><h3>Если стало тяжело</h3></div>'+para(p.p)+'</section>';
      }else if(p.k==='guide'){
        guideQ=p.q||'';
      }else{
        h+='<section class="card"><div class="ch"><h3>'+esc(p.t)+'</h3></div>'+para(p.p)+'</section>';
      }
    });
    var stop=meta&&meta.stop;
    h+='<section class="card guide"><div class="ch"><h3>✧ Для разговора с Энн</h3></div>'+
      (guideQ?'<div class="q">«'+esc(guideQ)+'»</div>':'')+
      '<p class="sm">'+(stop?'В день остановки неси Энн ответы за всю неделю целиком — там она видит больше всего.':'Скопируй ответы этого шага вместе с вопросом и вставь в разговор с Энн.')+'</p>'+
      '<div class="btns">'+(guideQ?'<button class="btn" type="button" data-copy="q">📋 Вопрос</button>':'')+
      '<button class="btn main" type="button" data-copy="all">📋 Мои ответы'+(guideQ?' + вопрос':'')+'</button>'+
      (stop?'<button class="btn" type="button" data-copy="week">📋 Ответы за неделю</button>':'')+'</div></section>';
    h+='<div class="donebox"><button class="donebtn" id="doneBtn" type="button"></button><p id="doneTxt"></p></div>';
    leaf.dataset.q=guideQ;
  }
  if(k==='author'||k==='intro'||k==='ann'){
    h+='<div class="donebox"><button class="donebtn" id="doneBtn" type="button"></button><p id="doneTxt"></p></div>';
  }
  leaf.innerHTML=h;
  // навигация
  if(prev)nav+='<a class="btn" href="#'+prev+'">‹ '+esc(label(prev))+'</a>';else nav+='<a class="btn" href="#map">‹ Карта пути</a>';
  if(next)nav+='<a class="btn main" href="#'+next+'">'+esc(label(next))+' ›</a>';else nav+='<a class="btn main" href="#map">Карта пути ›</a>';
  $('pnav').innerHTML=nav;
  // поля ответов
  [].forEach.call(leaf.querySelectorAll('textarea.ans'),function(t){
    var grow=function(){t.style.height='auto';t.style.height=Math.max(124,t.scrollHeight+2)+'px';};grow();
    var sv=$('sv-'+t.dataset.n+'-'+t.dataset.id),st=null;
    t.addEventListener('input',function(){grow();setAns(+t.dataset.n,t.dataset.id,t.value);clearTimeout(st);sv.classList.add('on');st=setTimeout(function(){sv.classList.remove('on');},1400);});
  });
  [].forEach.call(leaf.querySelectorAll('[data-copy]'),function(b){b.addEventListener('click',function(){copyFor(k,b.dataset.copy);});});
  var db=$('doneBtn');
  function paint(){var on=!!META.done[k];db.classList.toggle('on',on);db.textContent=on?'✓ Пройдено':(k.charAt(0)==='s'?'Отметить шаг пройденным':'Прочитано');
    $('doneTxt').textContent=on?(k.charAt(0)==='s'?'Засчитано. Можно вернуться к этому шагу в любой день.':''):'';}
  paint();
  db.addEventListener('click',function(){if(META.done[k])delete META.done[k];else{META.done[k]=1;toast(k.charAt(0)==='s'?'Шаг засчитан ✨':'Отмечено ✨');}saveMeta();paint();});
  // лист перелистывается
  var sh=$('sheet');sh.classList.remove('turn');void sh.offsetWidth;sh.classList.add('turn');
}
function findMeta(n){for(var i=0;i<B.stages.length;i++)for(var j=0;j<B.stages[i].steps.length;j++)if(B.stages[i].steps[j].n===n)return B.stages[i].steps[j];return null;}

/* ── копирование для Энн ── */
function stepText(n){
  var s=B.steps[n];if(!s)return '';
  var out=['Шаг '+n+'. '+s.t],any=false;
  s.parts.forEach(function(p){
    if(p.k==='task'){var a=getAns(n,'t'+p.no).trim();out.push('\n'+p.no+'. '+p.t+'\nМой ответ: '+(a||'(не написал(а))'));if(a)any=true;}
    if(p.k==='day'){var d=getAns(n,'day').trim();if(d){out.push('\nМаленькое задание на день\nКак прошло: '+d);any=true;}}
  });
  return any?out.join('\n'):'';
}
function copyFor(k,what){
  var n=+k.slice(1),q=$('leaf').dataset.q||'',txt='';
  if(what==='q'){txt=q;}
  else if(what==='week'){
    var parts=[];for(var i=Math.max(1,n-6);i<=n;i++){var t=stepText(i);if(t)parts.push(t);}
    txt=(parts.length?'Мои ответы за неделю (шаги '+Math.max(1,n-6)+'–'+n+'):\n\n'+parts.join('\n\n———\n\n'):'')+(q?'\n\nМой вопрос: '+q:'');
  }else{
    var t=stepText(n);txt=(t||'Шаг '+n+'. '+B.steps[n].t+'\n(ответов пока нет)')+(q?'\n\nМой вопрос: '+q:'');
  }
  if(!txt.trim()){toast('Пока нечего копировать — сначала напиши ответы');return;}
  copy(txt.trim(),what==='q'?'Вопрос скопирован — вставь его в разговор с Энн':'Скопировано — вставь в разговор с Энн 🤍');
}
function copy(text,msg){
  var ok=function(){toast(msg);},fb=function(){var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');ok();}catch(e){toast('Не получилось скопировать — выдели текст вручную');}ta.remove();};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(ok,fb);else fb();
}
var tt=null;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on');},2600);}

route();
})();
</script>
</body>
</html>
