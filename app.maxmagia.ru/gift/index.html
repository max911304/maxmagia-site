      var t=r.new?'Ты в клубе до <b>'+E(r.until_ru)+'</b>. Я открыл тебе личный кабинет — там расписание эфиров, записи, медитации и болталки клуба. А на почту пришла ссылка, чтобы входить с любого устройства.'
                 :'<b>+'+D.days+' день</b> — ты в клубе до <b>'+E(r.until_ru)+'</b> 🤍';
      msg('🎉',(r.new?'Добро пожаловать <em>в клуб!</em>':'Подарок <em>принят!</em>'),t,'<a class="btn gold" href="/?gift=1">Открыть личный кабинет</a>');
      if(r.new&&!r.demo)setTimeout(function(){location.href='/?gift=1';},6500);
    }
    setTimeout(function(){app.scrollIntoView({behavior:'smooth',block:'start'});},60);
  }
  function share(){var u=location.href;if(navigator.share){navigator.share({title:'🎁 Тебе подарок — месяц в клубе #MaxMagia',url:u}).catch(function(){});}else copy(u);}
  function copy(t){
    function ok(){var b=document.getElementById('copy');if(b){b.textContent='✓ Скопировано';setTimeout(function(){b.textContent='📋 Скопировать ссылку';},2500);}}
    try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,function(){fb(t);ok();});return;}}catch(e){}
    fb(t);ok();
  }
  function fb(t){var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;top:0;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();}

  /* ── салют ── */
  function fireworks(ox,oy){
    if(RM)return;
    var c=document.getElementById('fx'),x=c.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;
    c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
    var cols=['#f3dcae','#ecd29b','#d4b48a','#e8574a','#4fa3a5','#f5c94a','#ffffff'],R=[],P=[];
    var n=W<700?6:9;
    for(var i=0;i<n;i++)(function(i){setTimeout(function(){
      var tx=W*(.12+Math.random()*.76),ty=H*(.1+Math.random()*.32);
      R.push({x:ox,y:oy,sx:ox,sy:oy,tx:tx,ty:ty,t:0,d:520+Math.random()*260,c:cols[i%cols.length]});
    },i*260);})(i);
    for(var j=0;j<60;j++){var a=Math.random()*Math.PI*2,s=2+Math.random()*5;P.push({x:ox,y:oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,l:1,f:.012+Math.random()*.012,c:cols[j%cols.length],r:1.4+Math.random()*1.8,g:.1});}
    var last=performance.now(),end=last+n*260+3600;
    (function f(now){
      var dt=Math.min(40,now-last)/16.7;last=now;
      x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,.28)';x.fillRect(0,0,W,H);x.globalCompositeOperation='lighter';
      for(var i=R.length-1;i>=0;i--){var r=R[i];r.t+=16.7*dt;var k=Math.min(1,r.t/r.d),e=1-Math.pow(1-k,3);
        r.x=r.sx+(r.tx-r.sx)*e;r.y=r.sy+(r.ty-r.sy)*e;x.fillStyle=r.c;x.beginPath();x.arc(r.x,r.y,2,0,7);x.fill();
        if(k>=1){R.splice(i,1);var m=46+Math.random()*30,sp=2.2+Math.random()*2.2;
          for(var q=0;q<m;q++){var a=q/m*Math.PI*2,v=sp*(.6+Math.random()*.5);P.push({x:r.x,y:r.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,f:.011+Math.random()*.01,c:Math.random()<.25?'#ffffff':r.c,r:1.2+Math.random()*1.4,g:.045});}}}
      for(var p=P.length-1;p>=0;p--){var o=P[p];o.vx*=.985;o.vy=o.vy*.985+o.g*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.l-=o.f*dt;
        if(o.l<=0){P.splice(p,1);continue;}x.globalAlpha=Math.max(0,o.l);x.fillStyle=o.c;x.beginPath();x.arc(o.x,o.y,o.r*(.5+o.l*.5),0,7);x.fill();}
      x.globalAlpha=1;
      if(now<end||P.length||R.length)requestAnimationFrame(f);else{x.globalCompositeOperation='source-over';x.clearRect(0,0,W,H);}
    })(last);
  }

  /* ── старт ── */
  var again=seen()||RM;
  if(again){phase='skip';gp.classList.add('arrived');arrived=true;}
  else{skipB.classList.remove('hide');setTimeout(afterArrive,3600);}
  function loaded(r){
    D=r;
    if(phase==='skip'){
      if(OPENABLE[D.state]){showCard(false);render(true);}else{phase='done';render();}
      return;
    }
    next();
  }
  if(!CODE){loaded({state:'none'});return;}
  api('info?c='+encodeURIComponent(CODE)).then(function(r){
    if(!r||!r.ok){phase='done';skipB.classList.add('hide');app.innerHTML='<div class="msg"><div class="big">📡</div><p class="lead">Не получилось загрузить открытку — проверь интернет и обнови страницу.</p></div>';return;}
    loaded(r);
  });
})();
</script>
