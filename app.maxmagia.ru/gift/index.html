</main>
<script>
(function(){
  var CODE=new URLSearchParams(location.search).get('c')||'';
  var app=document.getElementById('app'),D=null,G='';
  function E(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function api(path,body){
    return fetch('/api/gift/'+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin',cache:'no-store'})
      .then(function(r){return r.json().catch(function(){return {ok:false,error:'server'};});}).catch(function(){return {ok:false,error:'net'};});
  }
  var GETS='<div class="gets"><div><b>🎥 Живые эфиры</b>встречи, практикумы, вопросы Максиму</div><div><b>🌙 Медитации</b>гипно-медитации, чтобы выдохнуть</div>'+
    '<div><b>📼 Все записи</b>смотреть, когда удобно</div><div><b>💬 Сообщество</b>тёплые люди рядом</div></div>';
  function noteHtml(){
    if(!D.note)return '';
    return '<div class="note"><q>'+E(D.note)+'</q><div class="by">— '+E(D.giver)+'</div></div>';
  }
  function head(){
    var to=D.to?E(D.to)+', '+'тебе':'Тебе';
    return '<h1>'+to+' <em>подарок</em></h1><p class="lead"><b>'+E(D.giver)+'</b> '+E(D.gave)+' тебе <b>'+D.days+' день</b> в клубе #MaxMagia — живые эфиры, практики, медитации и тёплое сообщество. Платить ничего не нужно.</p>';
  }
  function msg(icon,title,text,extra){app.innerHTML='<div class="msg"><div class="big">'+icon+'</div><h1 style="font-size:34px">'+title+'</h1><p class="lead">'+text+'</p>'+(extra||'')+'</div>';}
  var TGLINK=function(){return '<div class="tg">Удобнее в Telegram? <a href="'+E(D.tg)+'">Принять подарок через бот клуба</a></div>';};
  var MAXL='<a class="btn line" href="https://t.me/MaxGuschin">🙋 Написать Максиму</a>';

  function render(){
    var st=D.state;
    if(st==='none')return msg('🤔','Не нашёл подарок','Проверь ссылку — может, она скопировалась не целиком. Если что-то не так, напиши Максиму — он разберётся.',MAXL);
    if(st==='redeemed')return msg('🤍','Подарок уже открыт','По этой ссылке подарок уже приняли. Если это ошибка — напиши Максиму.',MAXL);
    if(st==='mine')return msg('🤍','Подарок уже твой','Ты уже принимал(а) этот подарок. Всё ждёт тебя в кабинете.','<a class="btn gold" href="/">Открыть личный кабинет</a>');
    if(st==='expired')return msg('⌛','Срок подарка истёк','К сожалению, подарок можно было открыть до '+E(D.expires)+'. Напиши Максиму — что-нибудь придумаем.',MAXL);
    if(st==='taken')return msg('🔒','Подарок уже открыли','Эту ссылку уже открыл другой человек в Telegram. Если тут ошибка — напиши Максиму.',MAXL);
    if(st==='own'){
      app.innerHTML=head()+noteHtml()+'<div class="box"><h2>🙂 Это твой подарок</h2><p class="sub">Так его увидит твой близкий. Перешли ему эту страницу — ссылка сработает один раз, до '+E(D.expires)+'.</p>'+
        '<button class="btn gold" id="share">📤 Отправить ссылку</button><button class="btn line" id="copy">📋 Скопировать ссылку</button></div>';
      document.getElementById('share').onclick=share;document.getElementById('copy').onclick=function(){copy(location.href);};
      if(!navigator.share)document.getElementById('share').classList.add('hide');
      return;
    }
    var me=D.me,form='';
    if(me){
      form='<div class="box"><h2>👋 '+(me.name?E(me.name)+', ':'')+'ты уже в клубе</h2><p class="sub">'+(me.member?'Подарок добавит <b>'+D.days+' день</b> к твоему участию.':'Остался один шаг — согласия ниже.')+'</p>'+
        (me.member?'':consents())+'<div class="err" id="err"></div><button class="btn gold" id="go">🎁 Принять подарок</button></div>';
    } else {
      form='<div class="box"><h2>🎁 Принять подарок</h2><p class="sub">Telegram не нужен. Напиши, как тебя зовут и твою почту — на неё придёт ссылка для входа в личный кабинет. Уже в клубе? Впиши почту, которую указывал(а) в клубе, — дни добавятся к твоему участию.</p>'+
        '<div class="f" id="f-name"><label>Как тебя зовут</label><input id="name" maxlength="60" autocomplete="given-name" placeholder="Имя"></div>'+
        '<div class="f" id="f-email"><label>Почта</label><input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@mail.ru"></div>'+
        '<div class="f hide" id="f-g"><label>Как к тебе обращаться?</label><div class="seg"><button type="button" data-g="f">Я — она</button><button type="button" data-g="m">Я — он</button></div></div>'+
        consents()+'<div class="err" id="err"></div><button class="btn gold" id="go">🎁 Принять подарок</button>'+
        '<div class="or">или</div>'+TGLINK()+'</div>';
    }
    app.innerHTML=head()+noteHtml()+GETS+form+'<p class="tg" style="margin-top:10px">Подарок можно открыть до <b>'+E(D.expires)+'</b>. Ссылка срабатывает один раз.</p>';
    document.getElementById('go').onclick=go;
    app.querySelectorAll('.seg button').forEach(function(b){b.onclick=function(){G=b.dataset.g;app.querySelectorAll('.seg button').forEach(function(x){x.classList.toggle('on',x===b);});};});
  }
  function consents(){
    return '<label class="ck" id="ck-offer"><input type="checkbox" id="offer"><span>Принимаю <a href="https://maxmagia.ru/oferta.html#gift" target="_blank">условия участия</a> и <a href="https://maxmagia.ru/rules.html" target="_blank">правила клуба</a></span></label>'+
      '<label class="ck" id="ck-pd"><input type="checkbox" id="pd"><span>Согласен(на) на <a href="https://maxmagia.ru/consent.html" target="_blank">обработку персональных данных</a> по <a href="https://maxmagia.ru/privacy.html" target="_blank">политике конфиденциальности</a></span></label>';
  }
  function val(id){var el=document.getElementById(id);return el?(el.type==='checkbox'?el.checked:el.value.trim()):'';}
  function bad(id,on){var el=document.getElementById(id);if(el)el.classList.toggle('bad',!!on);}
  function err(t){var e=document.getElementById('err');if(!e)return;e.textContent=t;e.style.display=t?'block':'none';}
  var ERR={consents:'Отметь, пожалуйста, оба согласия — без них открыть доступ я не могу.',fields:'Проверь имя и почту.',gender:'Подскажи, как к тебе обращаться — «она» или «он».',
    rate:'Слишком много попыток — попробуй через несколько минут.',taken:'Пока ты заполнял(а) форму, подарок открыл кто-то другой. Напиши Максиму.',own:'Это почта того, кто дарит, 🙂 Подарок — для другого человека.',
    use_tg:'Принять подарок на сайте пока нельзя — нажми «Принять подарок через бот клуба» ниже.',redeemed:'Подарок уже открыт.',expired:'Срок подарка истёк.',net:'Нет связи — проверь интернет и нажми ещё раз.'};
  function go(){
    var b=document.getElementById('go'),body={c:CODE,offer:val('offer'),pd:val('pd')};
    if(!D.me){
      body.name=val('name');body.email=val('email');body.gender=G;
      bad('f-name',!body.name);bad('f-email',!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(body.email));
      if(!body.name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(body.email))return err('Напиши имя и почту — на неё придёт ссылка для входа.');
    }
    var needCk=!D.me||!D.me.member;
    if(needCk){bad('ck-offer',!body.offer);bad('ck-pd',!body.pd);if(!body.offer||!body.pd)return err(ERR.consents);}
    err('');b.disabled=true;b.innerHTML='<span class="spin"></span>Открываю подарок…';
    api('claim',body).then(function(r){
      b.disabled=false;b.innerHTML='🎁 Принять подарок';
      if(r&&r.ok&&r.done)return done(r);
      var e=r&&r.error;
      if(e==='gender'){document.getElementById('f-g').classList.remove('hide');}
      if(e==='fields'){(r.fields||[]).forEach(function(f){bad('f-'+f,true);});}
      if(e==='use_tg'||e==='redeemed'||e==='expired'||e==='taken'){D.state=e==='use_tg'?D.state:e;}
      err(ERR[e]||'Что-то пошло не так 🙏 Попробуй ещё раз или напиши Максиму.');
    });
  }
  function done(r){
    confetti();setTimeout(function(){app.scrollIntoView({behavior:'smooth',block:'start'});},50);
    if(r.existing){
      return msg('🎉','Подарок <em>принят!</em>','<b>+'+D.days+' день</b> добавлен к твоему участию в клубе. Входи в кабинет как обычно — новая дата уже там. Письмо об этом тоже пришло на почту 🤍',
        '<a class="btn gold" href="/">Открыть личный кабинет</a>');
    }
    var t=r.new?'Ты в клубе до <b>'+E(r.until_ru)+'</b>. Я открыл тебе личный кабинет — там расписание эфиров, записи, медитации и болталки клуба. А на почту пришла ссылка, чтобы входить с любого устройства.'
               :'<b>+'+D.days+' день</b> — ты в клубе до <b>'+E(r.until_ru)+'</b> 🤍';
    setTimeout(function(){app.scrollIntoView({behavior:'smooth',block:'start'});},50);
    msg('🎉',(r.new?'Добро пожаловать <em>в клуб!</em>':'Подарок <em>принят!</em>'),t,'<a class="btn gold" href="/?gift=1">Открыть личный кабинет</a>');
    if(r.new)setTimeout(function(){location.href='/?gift=1';},6500);
  }
  function share(){var u=location.href;if(navigator.share){navigator.share({title:'🎁 Тебе подарок — месяц в клубе #MaxMagia',url:u}).catch(function(){});}else copy(u);}
  function copy(t){
    function ok(){var b=document.getElementById('copy');if(b){b.textContent='✓ Скопировано';setTimeout(function(){b.textContent='📋 Скопировать ссылку';},2500);}}
    try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,function(){fb(t);ok();});return;}}catch(e){}
    fb(t);ok();
  }
  function fb(t){var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;top:0;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();}
  function confetti(){
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    var c=document.getElementById('conf'),x=c.getContext('2d'),W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';
    var cols=['#ecd29b','#c8a96e','#e8574a','#f3dcae','#4fa3a5','#f5c94a'],P=[];
    for(var i=0;i<140;i++)P.push({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*16*devicePixelRatio,vy:(-Math.random()*18-6)*devicePixelRatio,s:(4+Math.random()*6)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%cols.length]});
